name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check app --exit-zero

      - name: Byte-compile check (catches syntax errors)
        run: python -m py_compile app/*.py app/routers/*.py app/utils/*.py

      - name: Start app and smoke-test health endpoint
        env:
          DATABASE_URL: "sqlite:///./ci.db"
          SECRET_KEY: "ci-test-secret-key"
          BOOTSTRAP_ADMIN_PASSWORD: "CiTestPassword123!"
        run: |
          nohup uvicorn app.main:app --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start"; cat uvicorn.log; exit 1

  frontend:
    name: Frontend (JS syntax)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JS syntax
        run: |
          for f in frontend/js/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

  shell-lint:
    name: Deployment script lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck deploy scripts
        run: shellcheck deploy/install_ubuntu22.sh deploy/reset_admin_password.sh deploy/diagnose.sh deploy/migrate.sh
